<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Smart Farmer Procurement</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="navbar">
    <a href="index.html" class="brand">🌾 Smart Farmer Procurement</a>
    <div class="nav-links">
        <span class="portal-tag farmer">Farmer</span>
        <a href="booking.html">New booking</a>
        <a href="queue.html">Live queue</a>
        <a href="payment.html">Payment</a>
        <a href="#" id="logoutLink">Logout</a>
    </div>
</div>

<div class="container">
    <h1>Welcome, <span id="farmerName">Farmer</span></h1>
    <div id="msgBox"></div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:24px;">
        <h2 style="margin:0; color:var(--ink-on-dark);">Your bookings</h2>
        <button class="secondary" id="refreshBtn" type="button">Refresh</button>
    </div>
    <div id="bookingsList" class="ledger"></div>
</div>

<footer class="site-footer">
    <div class="footer-bottom" style="margin-top:0; border-top:none; padding-top:0;">
        <span>© 2026 Smart Farmer Procurement System</span>
        <a href="index.html">Back to home</a>
    </div>
</footer>

<script src="config.js"></script>
<script>
const farmerId = localStorage.getItem("farmer_id");
if (!farmerId) window.location.href = "login.html";

document.getElementById("logoutLink").addEventListener("click", (e) => {
    e.preventDefault();
    localStorage.clear();
    window.location.href = "index.html";
});

function skeletonRows(n = 3) {
    return Array.from({ length: n }).map(() => `
        <div class="ledger-row">
            <div style="flex:1;">
                <div class="skeleton-line" style="width:40%;"></div>
                <div class="skeleton-line" style="width:65%;"></div>
            </div>
        </div>
    `).join("");
}

async function loadProfile() {
    const { ok, body } = await apiRequest(`/farmers/${farmerId}`, { headers: authHeaders() });
    if (ok) document.getElementById("farmerName").innerText = body.name; // innerText: safe, no escaping needed
}

async function loadBookings() {
    const listEl = document.getElementById("bookingsList");
    listEl.innerHTML = skeletonRows();

    const { ok, status, body } = await apiRequest(`/farmers/${farmerId}/bookings`, { headers: authHeaders() });

    if (status === 401 || status === 403) {
        localStorage.clear();
        window.location.href = "login.html";
        return;
    }

    if (!ok) {
        listEl.innerHTML = `<div class="msg error">Could not load bookings. ${escapeHtml(body?.detail || "")}</div>`;
        return;
    }

    if (!body || body.length === 0) {
        listEl.innerHTML = `
            <div class="empty-state">
                <p>You haven't booked a slot yet.</p>
                <a href="booking.html"><button>Book your first slot</button></a>
            </div>`;
        return;
    }

    // Most recent bookings first.
    const bookings = [...body].sort((a, b) => b.booking_id - a.booking_id);

    listEl.innerHTML = bookings.map(b => `
        <div class="ledger-row">
            <div class="token">#${escapeHtml(b.token_number ?? "—")}</div>
            <div class="details">
                <strong>Booking #${escapeHtml(b.booking_id)}</strong>
                <div class="meta">${escapeHtml(b.booking_date)} · ${escapeHtml(b.slot ?? "—")} · Qty ${escapeHtml(b.quantity)}</div>
            </div>
            <span class="status-badge" data-status="${escapeHtml(b.status)}">${escapeHtml(b.status)}</span>
            ${b.status === "BOOKED" ? `<button class="secondary cancel-btn" data-id="${escapeHtml(b.booking_id)}" type="button">Cancel</button>` : ""}
        </div>
    `).join("");

    document.querySelectorAll(".cancel-btn").forEach(btn => {
        btn.addEventListener("click", async function () {
            if (!confirm("Cancel this booking? This can't be undone.")) return;
            setButtonLoading(this, true, "Cancelling…");
            const { ok, status, body } = await apiRequest(`/bookings/${this.dataset.id}/cancel`, {
                method: "PUT",
                headers: authHeaders(),
            });

            if (status === 401 || status === 403) {
                localStorage.clear();
                window.location.href = "login.html";
                return;
            }

            if (!ok) {
                showToast(body?.detail || "Could not cancel booking", "error");
                setButtonLoading(this, false);
                return;
            }
            showToast("Booking cancelled", "success");
            loadBookings();
        });
    });
}

document.getElementById("refreshBtn").addEventListener("click", loadBookings);

loadProfile();
loadBookings();
</script>

</body>
</html>
